<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un regalito para mi amor ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #ffeef8 0%, #f0e6ff 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #4a3e4e;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 15px 35px rgba(210, 140, 180, 0.2);
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #d85c8a;
      margin-bottom: 10px;
    }

    p.sub {
      font-size: 0.9rem;
      color: #7a6a80;
      margin-bottom: 18px;
    }

    /* PASO 1: PUZZLE */
    #step-puzzle {
      display: block;
    }

    .puzzle-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 270px;
      height: 270px;
      margin: 0 auto 15px auto;
      background: #ffd6e7;
      padding: 6px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .piece {
      width: 82px;
      height: 82px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, opacity 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .piece.empty {
      background: rgba(255, 255, 255, 0.3) !important;
      box-shadow: none;
      cursor: default;
    }

    .btn {
      background: linear-gradient(135deg, #ff7597 0%, #d85c8a 100%);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(216, 92, 138, 0.35);
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(216, 92, 138, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: #9d8aa5;
      font-size: 0.82rem;
      margin-top: 10px;
      text-decoration: underline;
      cursor: pointer;
      border: none;
    }

    /* PASO 2: PUERTA DESBLOQUEADA */
    #step-door {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    .door-icon {
      font-size: 4rem;
      margin: 15px 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* PASO 3: DIBUJO Y CARTA */
    #step-drawing {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    .illustration-box {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 15px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03), 0 8px 20px rgba(0,0,0,0.05);
      position: relative;
    }

    /* SVG ANIMADO CON TEXTURA */
    svg#art-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .stroke-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 2.5s ease-in-out forwards;
    }

    .fade-fill {
      opacity: 0;
      animation: fadeInFill 1.2s ease forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeInFill {
      to { opacity: 1; }
    }

    /* CARTA FINAL */
    #letter-box {
      display: none;
      margin-top: 20px;
      background: #fff8fc;
      border: 2px dashed #f1789e;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      animation: fadeInUp 1s ease forwards;
    }

    #letter-box h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.9rem;
      color: #d85c8a;
      margin-bottom: 6px;
    }

    #letter-box p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #5a4b60;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: fixed;
      color: #ff6b8b;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
      z-index: 100;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- PASO 1: PUZZLE -->
    <div id="step-puzzle">
      <h1>🔓 La Puerta Secreta</h1>
      <p class="sub">Arma el rompecabezas para desbloquear el regalo</p>
      
      <div class="puzzle-board" id="puzzle-board"></div>
      
      <button class="btn-secondary" onclick="unlockDoor()">¿Muy difícil? Desbloquear de todos modos ✨</button>
    </div>

    <!-- PASO 2: PUERTA DESBLOQUEADA -->
    <div id="step-door">
      <h1>✨ ¡Puerta Desbloqueada! ✨</h1>
      <p class="sub">Presiona el botón para descubrir tu sorpresa</p>
      
      <div class="door-icon">🎁</div>
      
      <button class="btn" onclick="startSurprise()">✨ Abrir mi regalo ✨</button>
    </div>

    <!-- PASO 3: DIBUJO Y CARTA -->
    <div id="step-drawing">
      <h1>un dibujito para mi amor ❤️</h1>
      
      <div class="illustration-box">
        <svg id="art-svg" viewBox="0 0 400 450" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Filtro de textura Crayón/Lápiz -->
          <defs>
            <filter id="crayon-filter">
              <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>

          <!-- Corazón Izquierda -->
          <path class="stroke-path" style="animation-delay: 0s;" stroke="#e63946" stroke-width="4" stroke-linecap="round" stroke-dasharray="3,3" filter="url(#crayon-filter)"
            d="M 75,170 C 50,130 15,160 45,195 C 65,215 75,230 75,230 C 75,230 85,215 105,195 C 135,160 100,130 75,170 Z" />

          <!-- Corazón Arriba -->
          <path class="stroke-path" style="animation-delay: 0.8s;" stroke="#e63946" stroke-width="4" stroke-linecap="round" stroke-dasharray="3,3" filter="url(#crayon-filter)"
            d="M 200,65 C 180,30 150,55 175,85 C 190,100 200,112 200,112 C 200,112 210,100 225,85 C 250,55 220,30 200,65 Z" />

          <!-- Corazón Derecha -->
          <path class="stroke-path" style="animation-delay: 1.5s;" stroke="#e63946" stroke-width="4" stroke-linecap="round" stroke-dasharray="3,3" filter="url(#crayon-filter)"
            d="M 335,190 C 315,155 285,180 310,210 C 325,225 335,237 335,237 C 335,237 345,225 360,210 C 385,180 355,155 335,190 Z" />

          <!-- CORTES DE PELO Y SILUETA DEL CHICO (Rizado abundante) -->
          <g filter="url(#crayon-filter)" stroke="#2b1a0e" stroke-width="5" stroke-linecap="round">
            <!-- Rizos Cabeza Chico -->
            <path class="stroke-path" style="animation-delay: 2.2s;" d="M 170,160 C 150,130 180,95 220,100 C 260,100 300,120 300,165 C 305,195 285,215 260,215" />
            <path class="stroke-path" style="animation-delay: 2.6s;" d="M 185,135 C 200,115 235,115 255,130 C 275,145 285,175 270,200" />
            <path class="stroke-path" style="animation-delay: 3.0s;" d="M 205,110 C 225,95 255,105 275,125" />
            <!-- Espalda y Cuello Chico -->
            <path class="stroke-path" style="animation-delay: 3.4s;" d="M 245,215 C 275,230 310,260 325,310 L 340,370" />
            <!-- Frente beso -->
            <path class="stroke-path" style="animation-delay: 3.8s;" d="M 210,195 C 225,200 235,195 245,185" />
          </g>

          <!-- PELO Y CARA DE LA CHICA (Rizado largo tupido) -->
          <g filter="url(#crayon-filter)" stroke="#3a1e08" stroke-width="5" stroke-linecap="round">
            <!-- Rizos abundantes Chica -->
            <path class="stroke-path" style="animation-delay: 4.3s;" d="M 180,190 C 140,160 95,195 90,250 C 80,300 95,350 120,390" />
            <path class="stroke-path" style="animation-delay: 4.7s;" d="M 195,205 C 155,180 115,220 110,285 C 105,335 125,370 145,405" />
            <path class="stroke-path" style="animation-delay: 5.1s;" d="M 160,210 C 130,230 125,290 140,350 C 150,380 165,410 175,420" />
            <path class="stroke-path" style="animation-delay: 5.5s;" d="M 135,240 C 115,275 130,335 155,390" />
            <!-- Sonrisa Chica -->
            <path class="stroke-path" style="animation-delay: 5.9s;" stroke="#1a1a1a" stroke-width="4" d="M 160,240 C 175,260 200,260 210,240" />
            <!-- Ojitos cerrados felices -->
            <path class="stroke-path" style="animation-delay: 6.2s;" stroke="#1a1a1a" stroke-width="3.5" d="M 165,225 C 172,218 180,225 180,225" />
            <path class="stroke-path" style="animation-delay: 6.4s;" stroke="#1a1a1a" stroke-width="3.5" d="M 192,225 C 200,218 207,225 207,225" />
          </g>

          <!-- Mejillas Sonrojadas -->
          <ellipse class="fade-fill" style="animation-delay: 6.8s;" cx="158" cy="242" rx="12" ry="7" fill="#ffb3c1" />
          <ellipse class="fade-fill" style="animation-delay: 6.8s;" cx="212" cy="238" rx="12" ry="7" fill="#ffb3c1" />
        </svg>
      </div>

      <!-- CARTA ROMÁNTICA -->
      <div id="letter-box">
        <h2>Para el amor de mi vida ❤️</h2>
        <p>Hoy te amo mas que ayer y menos que mañana, TE AMO MI NIÑOOO</p>
      </div>
    </div>

  </div>

  <script>
    /* PUZZLE CON IMAGEN */
    const puzzleBoard = document.getElementById('puzzle-board');
    let pieces = [0, 1, 2, 3, 4, 5, 6, 8, 7];

    const imgCanvas = document.createElement('canvas');
    imgCanvas.width = 300; imgCanvas.height = 300;
    const imgCtx = imgCanvas.getContext('2d');
    
    imgCtx.fillStyle = '#ffeef5';
    imgCtx.fillRect(0, 0, 300, 300);
    imgCtx.fillStyle = '#ff6b8b';
    imgCtx.beginPath();
    imgCtx.arc(110, 120, 50, Math.PI, 0, false);
    imgCtx.arc(190, 120, 50, Math.PI, 0, false);
    imgCtx.lineTo(150, 220);
    imgCtx.closePath();
    imgCtx.fill();
    imgCtx.fillStyle = '#ffffff';
    imgCtx.font = 'bold 22px sans-serif';
    imgCtx.textAlign = 'center';
    imgCtx.fillText('TE AMO', 150, 140);

    function renderPuzzle() {
      puzzleBoard.innerHTML = '';
      pieces.forEach((pieceIdx, currentPos) => {
        const div = document.createElement('div');
        div.className = 'piece' + (pieceIdx === 8 ? ' empty' : '');

        if (pieceIdx !== 8) {
          const row = Math.floor(pieceIdx / 3);
          const col = pieceIdx % 3;
          div.style.backgroundImage = `url(${imgCanvas.toDataURL()})`;
          div.style.backgroundSize = '250px 250px';
          div.style.backgroundPosition = `-${col * 83}px -${row * 83}px`;
        }

        div.onclick = () => movePiece(currentPos);
        puzzleBoard.appendChild(div);
      });
    }

    function movePiece(pos) {
      const emptyPos = pieces.indexOf(8);
      const validMoves = [pos - 1, pos + 1, pos - 3, pos + 3];

      if (validMoves.includes(emptyPos)) {
        if ((pos % 3 === 0 && emptyPos === pos - 1) || (pos % 3 === 2 && emptyPos === pos + 1)) return;
        [pieces[pos], pieces[emptyPos]] = [pieces[emptyPos], pieces[pos]];
        renderPuzzle();
        checkPuzzleWin();
      }
    }

    function checkPuzzleWin() {
      if (pieces.every((val, idx) => val === idx)) {
        setTimeout(unlockDoor, 300);
      }
    }

    function unlockDoor() {
      document.getElementById('step-puzzle').style.display = 'none';
      document.getElementById('step-door').style.display = 'block';
    }

    renderPuzzle();

    /* INICIAR SORPRESA */
    function startSurprise() {
      document.getElementById('step-door').style.display = 'none';
      document.getElementById('step-drawing').style.display = 'block';
      
      playFlyMeToTheMoon();
      startHeartRain();

      setTimeout(() => {
        document.getElementById('letter-box').style.display = 'block';
      }, 7200);
    }

    /* MÚSICA */
    function playFlyMeToTheMoon() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [
          {f: 329.63, d: 0.6}, {f: 293.66, d: 0.4}, {f: 261.63, d: 0.4}, {f: 246.94, d: 0.4},
          {f: 220.00, d: 0.8}, {f: 293.66, d: 0.6}, {f: 261.63, d: 0.4}, {f: 246.94, d: 0.4},
          {f: 220.00, d: 0.4}, {f: 196.00, d: 0.8}, {f: 261.63, d: 0.6}, {f: 246.94, d: 0.4}
        ];
        let time = ctx.currentTime + 0.1;
        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, time);
          gain.gain.setValueAtTime(0.12, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time);
          osc.stop(time + note.d);
          time += note.d;
        });
      } catch (e) {}
    }

    /* CORAZONES FLOTANTES */
    function startHeartRain() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = ['❤️', '💖', '✨', '💕'][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }, 400);
    }
  </script>
</body>
</html>
