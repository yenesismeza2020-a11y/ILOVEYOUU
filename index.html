<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un regalito para mi amor ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #ffeef8 0%, #f0e6ff 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #4a3e4e;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 15px 35px rgba(210, 140, 180, 0.2);
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #d85c8a;
      margin-bottom: 10px;
    }

    p.sub {
      font-size: 0.9rem;
      color: #7a6a80;
      margin-bottom: 18px;
    }

    /* PASO 1: PUZZLE DE IMAGEN */
    #step-puzzle {
      display: block;
    }

    .puzzle-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 270px;
      height: 270px;
      margin: 0 auto 15px auto;
      background: #ffd6e7;
      padding: 6px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .piece {
      width: 82px;
      height: 82px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, opacity 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .piece.empty {
      background: rgba(255, 255, 255, 0.3) !important;
      box-shadow: none;
      cursor: default;
    }

    .btn {
      background: linear-gradient(135deg, #ff7597 0%, #d85c8a 100%);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(216, 92, 138, 0.35);
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(216, 92, 138, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: #9d8aa5;
      font-size: 0.82rem;
      margin-top: 10px;
      text-decoration: underline;
      cursor: pointer;
      border: none;
    }

    /* PASO 2: PUERTA DESBLOQUEADA */
    #step-door {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    .door-icon {
      font-size: 4rem;
      margin: 15px 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* PASO 3: DIBUJO Y CARTA */
    #step-drawing {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    .canvas-container {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03), 0 8px 20px rgba(0,0,0,0.05);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    /* CARTA FINAL */
    #letter-box {
      display: none;
      margin-top: 20px;
      background: #fff8fc;
      border: 2px dashed #f1789e;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      animation: fadeInUp 1s ease forwards;
    }

    #letter-box h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.9rem;
      color: #d85c8a;
      margin-bottom: 6px;
    }

    #letter-box p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #5a4b60;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Corazones Flotantes */
    .heart {
      position: fixed;
      color: #ff6b8b;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
      z-index: 100;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- PASO 1: PUZZLE -->
    <div id="step-puzzle">
      <h1>🔓 La Puerta Secreta</h1>
      <p class="sub">Arma el rompecabezas para desbloquear el regalo</p>
      
      <div class="puzzle-board" id="puzzle-board"></div>
      
      <button class="btn-secondary" onclick="unlockDoor()">¿Muy difícil? Desbloquear de todos modos ✨</button>
    </div>

    <!-- PASO 2: PUERTA DESBLOQUEADA -->
    <div id="step-door">
      <h1>✨ ¡Puerta Desbloqueada! ✨</h1>
      <p class="sub">Presiona el botón para descubrir tu sorpresa</p>
      
      <div class="door-icon">🎁</div>
      
      <button class="btn" onclick="startSurprise()">✨ Abrir mi regalo ✨</button>
    </div>

    <!-- PASO 3: DIBUJO Y CARTA -->
    <div id="step-drawing">
      <h1 id="drawing-title">un dibujito para mi amor ❤️</h1>
      
      <div class="canvas-container">
        <canvas id="drawingCanvas" width="400" height="420"></canvas>
      </div>

      <!-- CARTA ROMÁNTICA -->
      <div id="letter-box">
        <h2>Para el amor de mi vida ❤️</h2>
        <p>Hoy te amo mas que ayer y menos que mañana, TE AMO MI NIÑOOO</p>
      </div>
    </div>

  </div>

  <script>
    /* --- LÓGICA DEL PUZZLE CON IMAGEN GENERADA EN CANVAS --- */
    const puzzleBoard = document.getElementById('puzzle-board');
    let pieces = [0, 1, 2, 3, 4, 5, 6, 8, 7]; // Desordenado pero solucionable

    // Generar imagen para el puzzle mediante canvas
    const imgCanvas = document.createElement('canvas');
    imgCanvas.width = 300;
    imgCanvas.height = 300;
    const imgCtx = imgCanvas.getContext('2d');
    
    // Dibujar corazón lindo en la imagen del puzzle
    imgCtx.fillStyle = '#ffeef5';
    imgCtx.fillRect(0, 0, 300, 300);
    imgCtx.fillStyle = '#ff6b8b';
    imgCtx.beginPath();
    imgCtx.arc(110, 120, 50, Math.PI, 0, false);
    imgCtx.arc(190, 120, 50, Math.PI, 0, false);
    imgCtx.lineTo(150, 220);
    imgCtx.closePath();
    imgCtx.fill();
    imgCtx.fillStyle = '#ffffff';
    imgCtx.font = 'bold 22px sans-serif';
    imgCtx.textAlign = 'center';
    imgCtx.fillText('TE AMO', 150, 140);

    function renderPuzzle() {
      puzzleBoard.innerHTML = '';
      pieces.forEach((pieceIdx, currentPos) => {
        const div = document.createElement('div');
        div.className = 'piece' + (pieceIdx === 8 ? ' empty' : '');

        if (pieceIdx !== 8) {
          const row = Math.floor(pieceIdx / 3);
          const col = pieceIdx % 3;
          div.style.backgroundImage = `url(${imgCanvas.toDataURL()})`;
          div.style.backgroundSize = '250px 250px';
          div.style.backgroundPosition = `-${col * 83}px -${row * 83}px`;
        }

        div.onclick = () => movePiece(currentPos);
        puzzleBoard.appendChild(div);
      });
    }

    function movePiece(pos) {
      const emptyPos = pieces.indexOf(8);
      const validMoves = [pos - 1, pos + 1, pos - 3, pos + 3];

      if (validMoves.includes(emptyPos)) {
        if ((pos % 3 === 0 && emptyPos === pos - 1) || (pos % 3 === 2 && emptyPos === pos + 1)) return;
        [pieces[pos], pieces[emptyPos]] = [pieces[emptyPos], pieces[pos]];
        renderPuzzle();
        checkPuzzleWin();
      }
    }

    function checkPuzzleWin() {
      if (pieces.every((val, idx) => val === idx)) {
        setTimeout(unlockDoor, 300);
      }
    }

    function unlockDoor() {
      document.getElementById('step-puzzle').style.display = 'none';
      document.getElementById('step-door').style.display = 'block';
    }

    renderPuzzle();

    /* --- INICIAR SORPRESA --- */
    function startSurprise() {
      document.getElementById('step-door').style.display = 'none';
      document.getElementById('step-drawing').style.display = 'block';
      
      playFlyMeToTheMoon();
      startHeartRain();
      animateDrawing();
    }

    /* --- DIBUJO ANIMADO TRAZO A TRAZO (CANVAS) --- */
    function animateDrawing() {
      const canvas = document.getElementById('drawingCanvas');
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      // Definición de trazos exactos para la parejita
      const paths = [
        // Corazón Izquierda
        { color: '#e63946', delay: 0, points: [{x:60,y:140},{x:50,y:125},{x:40,y:140},{x:60,y:170},{x:80,y:140},{x:70,y:125},{x:60,y:140}] },
        // Corazón Arriba
        { color: '#e63946', delay: 600, points: [{x:200,y:70},{x:185,y:50},{x:170,y:70},{x:200,y:105},{x:230,y:70},{x:215,y:50},{x:200,y:70}] },
        // Corazón Derecha
        { color: '#e63946', delay: 1200, points: [{x:340,y:180},{x:330,y:165},{x:320,y:180},{x:340,y:210},{x:360,y:180},{x:350,y:165},{x:340,y:180}] },
        
        // Pelo Chico (Rizos superiores)
        { color: '#3a2312', delay: 1800, points: [{x:180,y:150},{x:170,y:130},{x:190,y:110},{x:220,y:105},{x:250,y:115},{x:270,y:135},{x:280,y:160},{x:270,y:185},{x:250,y:200},{x:230,y:200}] },
        { color: '#3a2312', delay: 2400, points: [{x:190,y:130},{x:210,y:120},{x:240,y:125},{x:260,y:145},{x:265,y:170}] },
        
        // Espalda/Cuerpo del chico
        { color: '#2b2d42', delay: 3000, points: [{x:240,y:210},{x:270,y:225},{x:300,y:250},{x:315,y:300},{x:325,y:350}] },

        // Pelo Largo y Rizado de la Chica
        { color: '#4a2c11', delay: 3600, points: [{x:180,y:180},{x:150,y:160},{x:120,y:180},{x:100,y:220},{x:90,y:270},{x:100,y:320},{x:120,y:360},{x:145,y:390}] },
        { color: '#4a2c11', delay: 4200, points: [{x:160,y:190},{x:130,y:200},{x:110,y:240},{x:115,y:290},{x:130,y:340},{x:155,y:385}] },
        { color: '#4a2c11', delay: 4800, points: [{x:140,y:210},{x:125,y:250},{x:135,y:310},{x:165,y:370}] },

        // Carita y Sonrisa de la Chica
        { color: '#2b2d42', delay: 5400, points: [{x:155,y:235},{x:170,y:255},{x:195,y:255},{x:210,y:235}] },
        // Ojitos de felicidad (Chica)
        { color: '#2b2d42', delay: 6000, points: [{x:165,y:225},{x:172,y:218},{x:180,y:225}] },
        { color: '#2b2d42', delay: 6200, points: [{x:190,y:225},{x:198,y:218},{x:205,y:225}] }
      ];

      paths.forEach(p => {
        setTimeout(() => {
          drawSmoothPath(ctx, p.points, p.color);
        }, p.delay);
      });

      // Sonrojo y Carta al finalizar
      setTimeout(() => {
        // Mejillas rosadas
        ctx.fillStyle = 'rgba(255, 154, 162, 0.6)';
        ctx.beginPath(); ctx.arc(160, 235, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(210, 230, 10, 0, Math.PI * 2); ctx.fill();

        // Mostrar la carta abajo
        document.getElementById('letter-box').style.display = 'block';
      }, 6800);
    }

    function drawSmoothPath(ctx, points, color) {
      ctx.strokeStyle = color;
      let i = 0;
      function step() {
        if (i < points.length - 1) {
          ctx.beginPath();
          ctx.moveTo(points[i].x, points[i].y);
          ctx.lineTo(points[i+1].x, points[i+1].y);
          ctx.stroke();
          i++;
          requestAnimationFrame(step);
        }
      }
      step();
    }

    /* --- MÚSICA INSTRUMENTAL ("Fly Me to the Moon" Melody) --- */
    function playFlyMeToTheMoon() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        
        // Notas aproximadas de la melodía principal
        const notes = [
          {f: 329.63, d: 0.6}, {f: 293.66, d: 0.4}, {f: 261.63, d: 0.4}, {f: 246.94, d: 0.4},
          {f: 220.00, d: 0.8}, {f: 293.66, d: 0.6}, {f: 261.63, d: 0.4}, {f: 246.94, d: 0.4},
          {f: 220.00, d: 0.4}, {f: 196.00, d: 0.8}, {f: 261.63, d: 0.6}, {f: 246.94, d: 0.4},
          {f: 220.00, d: 0.4}, {f: 196.00, d: 0.4}, {f: 174.61, d: 0.8}
        ];

        let time = ctx.currentTime + 0.1;

        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle'; // Sonido suave tipo piano/flauta
          osc.frequency.setValueAtTime(note.f, time);

          gain.gain.setValueAtTime(0.12, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(time);
          osc.stop(time + note.d);

          time += note.d;
        });
      } catch (e) {
        console.log('Audio no iniciado');
      }
    }

    /* --- LLUVIA DE CORAZONES --- */
    function startHeartRain() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = ['❤️', '💖', '✨', '💕'][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.body.appendChild(heart);
        
        setTimeout(() => heart.remove(), 4000);
      }, 400);
    }
  </script>
</body>
</html>
